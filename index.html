
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101d2f">
<title>Pokémon Card Grader</title>
<style>
body{margin:0;padding:20px;background:#07111f;color:white;font-family:Arial,sans-serif}
h1{color:#5de1ef}
.card{background:#101d2f;padding:16px;border-radius:16px;margin:16px 0}
label{display:block;margin:12px 0}
input{width:100%;margin-top:8px}
button{background:#5de1ef;color:#07111f;padding:14px;border:0;border-radius:12px;font-weight:bold;width:100%}
img{max-width:100%;max-height:240px;display:block;margin-top:12px}
p{line-height:1.5;color:#c4d1df}
</style>
</head>
<body>
<h1>Pokémon Card Grader</h1>
<p>Prototipo locale per controllare le foto delle tue carte.</p>

<div class="card">
<h3>📸 Fronte della carta</h3>
<input type="file" accept="image/*" capture="environment" id="front">
<img id="frontImg" hidden>
</div>

<div class="card">
<h3>📸 Retro della carta</h3>
<input type="file" accept="image/*" capture="environment" id="back">
<img id="backImg" hidden>
</div>

<button onclick="analyze()">Controlla le foto</button>

<div class="card" id="result">
<h3>Risultato</h3>
<p>Seleziona entrambe le foto per iniziare.</p>
</div>

<script>
function preview(input,img){
 input.addEventListener('change',()=>{
  const file=input.files[0];
  if(!file)return;
  img.src=URL.createObjectURL(file);
  img.hidden=false;
 });
}
preview(document.getElementById('front'),document.getElementById('frontImg'));
preview(document.getElementById('back'),document.getElementById('backImg'));

function analyze(){
 const f=document.getElementById('front').files[0];
 const b=document.getElementById('back').files[0];
 const r=document.getElementById('result');
 if(!f||!b){
  r.innerHTML='<h3>Attenzione</h3><p>Scatta o seleziona sia il fronte sia il retro.</p>';
  return;
 }
 r.innerHTML='<h3>Foto caricate!</h3><p>Fronte: '+(f.size/1024).toFixed(0)+' KB</p><p>Retro: '+(b.size/1024).toFixed(0)+' KB</p><p>Le foto sono elaborate in questa pagina. Il voto e il centraggio automatico non sono ancora disponibili in questa versione.</p>';
}
</script>
</body>
</html>
